<style>
/* Layout: una sola columna centrada, dos botones grandes para elegir capítulo */
:root{--bg:#1d1a2b;--fg:#f4efe2;--muted:#b8b2c8;--accent:#ffb23e;--accent-fg:#24180a;--line:#3a3552;--display:"Comic Neue","Comic Sans MS",sans-serif}
:root{color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);padding-inline:16px;padding-block:48px;min-height:100%}
main{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:2.6rem;line-height:1.05;margin:0;text-wrap:balance}
p{font-size:1.1rem;line-height:1.4;margin:0;color:var(--muted)}
a.btn{display:block;padding:16px 20px;border-radius:12px;font-weight:700;font-size:1.2rem;text-decoration:none;border:2px solid var(--line);color:var(--fg)}
a.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
a.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
small{color:var(--muted)}
